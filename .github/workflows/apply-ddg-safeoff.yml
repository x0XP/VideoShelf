name: Apply DuckDuckGo Safe Search Off

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply DuckDuckGo Safe Search off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Force Safe Search off for DuckDuckGo image lookups
        shell: pwsh
        run: |
          $files = @(
            'src/VideoShelf/Search/PortraitLookup.cs',
            'src/VideoShelf/Search/OnlineThumbnailLookup.cs'
          )
          foreach ($file in $files) {
            $text = Get-Content -Raw $file
            $text = $text.Replace('&iax=images&ia=images&kp=1', '&iax=images&ia=images&kp=-2')
            $text = $text.Replace('&p=1";', '&p=1&kp=-2";')
            Set-Content -Path $file -Value $text -NoNewline
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VideoShelf/Search/PortraitLookup.cs src/VideoShelf/Search/OnlineThumbnailLookup.cs
          git diff --cached --exit-code && throw 'No DuckDuckGo Safe Search settings were changed.'
          git commit -m 'Disable DuckDuckGo Safe Search for image lookups'
          git push
