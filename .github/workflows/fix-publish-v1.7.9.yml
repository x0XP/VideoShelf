name: Fix v1.7.9 publisher wait

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-publish-v1.7.9.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix updater wait semantics
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/publish-v1.7.9.yml')
          s = p.read_text()
          old = "$upgrade = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/VIDEOSHELFUPDATE=1',('/DIR=\"' + $installDir + '\"')) -Wait -PassThru"
          new = "$upgrade = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/VIDEOSHELFUPDATE=1',('/DIR=\"' + $installDir + '\"')) -PassThru\n          $upgrade.WaitForExit()"
          if old not in s:
              raise SystemExit('upgrade wait line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit publisher fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish-v1.7.9.yml
          git commit -m 'Fix v1.7.9 updater test wait'
          git push
