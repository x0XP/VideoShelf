name: Apply player media controls

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-player-media-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply player patch
        run: python .github/scripts/patch_player_media_controls.py
      - name: Commit player controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/VideoShelf.TransferHost/Player/OptimizedStreamForm.cs
          git commit -m "Add external subtitles and volume controls"
          git push origin main
