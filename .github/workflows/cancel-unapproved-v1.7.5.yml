name: Cancel unapproved v1.7.5 publisher

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cancel-unapproved-v1.7.5.yml'

permissions:
  actions: write

jobs:
  cancel-unapproved-publisher:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '34778348642'
    steps:
      - name: Cancel unapproved publisher run
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"
          echo "Requested cancellation of workflow run ${RUN_ID}."
