name: Update relaunch regression

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/VideoShelf.iss'
      - 'src/VideoShelf/Application/AppVersion.cs'
      - 'src/VideoShelf/Application/UpdateService.cs'
      - 'src/VideoShelf/Application/VideoShelf.cs'
      - 'src/VideoShelf.TransferHost/**'
      - '.github/workflows/update-relaunch.yml'

jobs:
  update-relaunch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build VideoShelf and transfer runtime
        shell: powershell
        run: |
          cmd /c Start.cmd --build-only
          if ($LASTEXITCODE -ne 0) { throw 'VideoShelf build failed.' }

          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-update-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\src\VideoShelf.TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          Copy-Item '.\VideoShelf.ico' (Join-Path $package 'VideoShelf.ico')
          Copy-Item '.\VideoShelf.png' (Join-Path $package 'VideoShelf.png')
          "VIDEOSHELF_UPDATE_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build update installer
        shell: powershell
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found.' }

          $source = Get-Content '.\src\VideoShelf\Application\AppVersion.cs' -Raw
          $match = [regex]::Match($source, 'Current\s*=\s*"([0-9]+(?:\.[0-9]+){1,3})"')
          if (-not $match.Success) { throw 'Could not resolve AppVersion.Current.' }
          $version = $match.Groups[1].Value

          $installerDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-update-installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          & $iscc "/DSourceDir=$env:VIDEOSHELF_UPDATE_PACKAGE" "/DOutputDir=$installerDir" "/DAppVersion=$version" '.\installer\VideoShelf.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Update installer compilation failed.' }
          $installer = Join-Path $installerDir 'VideoShelf-Setup-v1.7.exe'
          if (!(Test-Path $installer)) { throw 'Update installer was not created.' }
          "VIDEOSHELF_UPDATE_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prove updater handoff waits and relaunches VideoShelf
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-update-handoff-install'
          $mainExe = Join-Path $installDir 'VideoShelf.exe'

          $first = Start-Process -FilePath $env:VIDEOSHELF_UPDATE_INSTALLER -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')
          ) -Wait -PassThru
          if ($first.ExitCode -ne 0) { throw "Initial install failed with exit code $($first.ExitCode)." }
          if (!(Test-Path $mainExe)) { throw 'Initial install did not create VideoShelf.exe.' }

          $selfTest = Start-Process -FilePath $mainExe -ArgumentList '--self-test' -WorkingDirectory $installDir -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw 'Installed VideoShelf self-test failed before updater handoff.' }

          $unexpected = @(Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object {
            try { $_.Path -eq $mainExe } catch { $false }
          })
          if ($unexpected.Count -gt 0) {
            $unexpected | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'A clean silent install unexpectedly launched VideoShelf.'
          }

          $probe = Join-Path $env:RUNNER_TEMP 'invoke-videoshelf-updater.ps1'
          @'
          param([string]$MainExe, [string]$Installer)
          $assembly = [Reflection.Assembly]::LoadFrom($MainExe)
          $type = $assembly.GetType('VideoShelf.UpdateService', $true)
          $flags = [Reflection.BindingFlags]::Public -bor [Reflection.BindingFlags]::Static
          $method = $type.GetMethod('LaunchInstallerAndRestart', $flags)
          if ($null -eq $method) { throw 'LaunchInstallerAndRestart was not found.' }
          $null = $method.Invoke($null, @($Installer))
          Start-Sleep -Seconds 3
          '@ | Set-Content -Path $probe -Encoding UTF8

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probe -MainExe $mainExe -Installer $env:VIDEOSHELF_UPDATE_INSTALLER
          if ($LASTEXITCODE -ne 0) { throw "Updater handoff probe failed with exit code $LASTEXITCODE." }

          $launched = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(45)
          while ([DateTime]::UtcNow -lt $deadline -and $null -eq $launched) {
            $launched = Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object {
              try { $_.Path -eq $mainExe } catch { $false }
            } | Select-Object -First 1
            if ($null -eq $launched) { Start-Sleep -Milliseconds 500 }
          }
          if ($null -eq $launched) { throw 'The updater handoff completed but VideoShelf did not relaunch.' }
          Start-Sleep -Seconds 2
          $running = @(Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object {
            try { $_.Path -eq $mainExe } catch { $false }
          })
          if ($running.Count -ne 1) { throw "Expected one relaunched VideoShelf process, found $($running.Count)." }
          Write-Host "Updater handoff relaunched VideoShelf successfully (PID $($running[0].Id))."
          $running | Stop-Process -Force -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller was not found after updater handoff.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall after updater handoff failed.' }

      - name: Prove legacy runtime and app are cleanly replaced
        shell: powershell
        run: |
          $legacyInstaller = Join-Path $env:RUNNER_TEMP 'VideoShelf-Setup-v1.7.3.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/x0XP/VideoShelf/releases/download/v1.7.3/VideoShelf-Setup-v1.7.3.exe' -OutFile $legacyInstaller
          $legacyHash = (Get-FileHash -Path $legacyInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyHash -ne '671711fa068c8aeb31221cf97eb608c90424a96bf010dec6c4035022a2085b02') {
            throw "Unexpected v1.7.3 installer hash: $legacyHash"
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-legacy-upgrade-install'
          $legacyInstall = Start-Process -FilePath $legacyInstaller -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')
          ) -Wait -PassThru
          if ($legacyInstall.ExitCode -ne 0) { throw "Legacy install failed with exit code $($legacyInstall.ExitCode)." }

          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferDir = Join-Path $installDir 'TransferHost'
          $transferExe = Join-Path $transferDir 'VideoShelf.TransferHost.exe'
          $transferDll = Join-Path $transferDir 'VideoShelf.TransferHost.dll'
          if (!(Test-Path $mainExe) -or !(Test-Path $transferExe) -or !(Test-Path $transferDll)) { throw 'Legacy VideoShelf installation was incomplete.' }
          'must disappear during clean runtime replacement' | Set-Content -Path (Join-Path $transferDir 'legacy-runtime-sentinel.txt') -Encoding ASCII

          # Keep both the old main app and old transfer runtime alive. This recreates the
          # conditions which previously allowed the updater to race the old process/mutex
          # and to leave an old TransferHost DLL beside a new MonoTorrent runtime.
          $legacyMain = Start-Process -FilePath $mainExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 2
          if ($legacyMain.HasExited) { throw 'Legacy VideoShelf did not remain running long enough to test update relaunch compatibility.' }

          $legacyHost = Start-Process -FilePath $transferExe -ArgumentList @(
            'stream','--source','magnet:?xt=urn:btih:0123456789012345678901234567890123456789','--title','LegacyLock'
          ) -WorkingDirectory $transferDir -PassThru
          Start-Sleep -Seconds 2
          if ($legacyHost.HasExited) { throw 'Legacy TransferHost did not remain running long enough to test locked-runtime replacement.' }

          $upgrade = Start-Process -FilePath $env:VIDEOSHELF_UPDATE_INSTALLER -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/VIDEOSHELFUPDATE=1',('/DIR="' + $installDir + '"')
          ) -PassThru
          $upgrade.WaitForExit()
          if ($upgrade.ExitCode -ne 0) { throw "Legacy upgrade failed with exit code $($upgrade.ExitCode)." }

          try { $legacyMain.Refresh() } catch { }
          if (-not $legacyMain.HasExited) {
            Stop-Process -Id $legacyMain.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not terminate the old VideoShelf process before relaunch.'
          }
          try { $legacyHost.Refresh() } catch { }
          if (-not $legacyHost.HasExited) {
            Stop-Process -Id $legacyHost.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not stop the legacy TransferHost before replacing its runtime.'
          }
          if (Test-Path (Join-Path $transferDir 'legacy-runtime-sentinel.txt')) { throw 'Legacy TransferHost contents survived the upgrade.' }

          $expectedDll = Join-Path $env:VIDEOSHELF_UPDATE_PACKAGE 'TransferHost\VideoShelf.TransferHost.dll'
          if (!(Test-Path $expectedDll) -or !(Test-Path $transferDll)) { throw 'TransferHost DLL missing after upgrade.' }
          $expectedHash = (Get-FileHash $expectedDll -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $transferDll -Algorithm SHA256).Hash
          if ($installedHash -ne $expectedHash) { throw 'Installed TransferHost DLL does not match the current package.' }

          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory $transferDir -Wait -PassThru
          if ($transferTest.ExitCode -ne 0) { throw 'TransferHost self-test failed after v1.7.3 -> current upgrade.' }

          $restarted = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ([DateTime]::UtcNow -lt $deadline -and $null -eq $restarted) {
            $restarted = Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object {
              try { $_.Path -eq $mainExe -and $_.Id -ne $legacyMain.Id } catch { $false }
            } | Select-Object -First 1
            if ($null -eq $restarted) { Start-Sleep -Milliseconds 500 }
          }
          if ($null -eq $restarted) { throw 'Legacy update installed successfully but the new VideoShelf process did not reopen.' }
          Start-Sleep -Seconds 2
          if ($restarted.HasExited) { throw 'Relaunched VideoShelf exited immediately after legacy upgrade.' }
          Write-Host "Legacy upgrade replaced the runtime and relaunched VideoShelf successfully (PID $($restarted.Id))."

          Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object {
            try { $_.Path -eq $mainExe } catch { $false }
          } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'VideoShelf.TransferHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller was not found after legacy upgrade.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall after legacy runtime regression test failed.' }
