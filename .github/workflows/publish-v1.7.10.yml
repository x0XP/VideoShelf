name: Publish approved v1.7.10

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.7.10.yml'

permissions:
  contents: write

jobs:
  publish-v1-7-10:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: 1.7.10
      RELEASE_TAG: v1.7.10
      RELEASE_SOURCE: 8ac24ded52042dc82a0a565ee3b759245603d444
      PREVIOUS_VERSION: 1.7.9
      PREVIOUS_SHA256: 2c29fe19aea39e01367015c04cafe6787c9085a2dcb2144c67a526cfbeae0354
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SOURCE }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify approved source
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SOURCE) { throw "Expected source $env:RELEASE_SOURCE but checked out $head." }
          $version = Get-Content '.\src\VideoShelf\Application\AppVersion.cs' -Raw
          if ($version -notmatch 'Current="1\.7\.10"') { throw 'Approved source is not v1.7.10.' }
          $project = Get-Content '.\src\VideoShelf.TransferHost\VideoShelf.TransferHost.csproj' -Raw
          if ($project -notmatch 'MonoTorrent" Version="3\.0\.2"') { throw 'Stable MonoTorrent 3.0.2 runtime is required.' }
          $thumb = Get-Content '.\src\VideoShelf\Search\OnlineThumbnailLookup.cs' -Raw
          $online = Get-Content '.\src\VideoShelf\UI\Shelf\Shelf.Online.cs' -Raw
          if ($thumb -notmatch '!safeoff' -or $thumb -notmatch '&p=-2&kp=-2') { throw 'Safe Search-off image request handling is missing.' }
          if ($thumb -notmatch 'string key="v4\|' -or $thumb -notmatch 'CandidateScore\(row,id,context\)') { throw 'Contextual thumbnail lookup is missing.' }
          if ($online -notmatch 'thumbnailContext=onlineQueryFor' -or $online -notmatch 'Find\(row.Title,thumbnailContext,ct\)') { throw 'Search context is not wired into thumbnails.' }
          if ($thumb -notmatch 'Task.Delay\(1000,ct\)' -or ([regex]::Matches($thumb,'Task.Delay\(500,ct\)').Count -lt 2)) { throw 'Thumbnail pacing does not match the approved source.' }

      - name: Build and self-test VideoShelf
        shell: cmd
        run: |
          Start.cmd --build-only
          VideoShelf.exe --self-test

      - name: Publish and self-test transfer runtime
        shell: powershell
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-release-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\src\VideoShelf.TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          Copy-Item '.\VideoShelf.ico' (Join-Path $package 'VideoShelf.ico')
          Copy-Item '.\VideoShelf.png' (Join-Path $package 'VideoShelf.png')
          $test = Start-Process -FilePath (Join-Path $transferDir 'VideoShelf.TransferHost.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'TransferHost self-test failed.' }
          "VIDEOSHELF_RELEASE_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exact v1.7.10 installer
        shell: powershell
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { throw 'ISCC.exe was not found.' }
          $issPath = '.\installer\VideoShelf.release.iss'
          $iss = Get-Content '.\installer\VideoShelf.iss' -Raw
          $iss = [regex]::Replace($iss, '(?m)^OutputBaseFilename=.*$', "OutputBaseFilename=VideoShelf-Setup-v$env:RELEASE_VERSION")
          $iss = [regex]::Replace($iss, '(?m)^VersionInfoVersion=.*$', "VersionInfoVersion=$env:RELEASE_VERSION.0")
          Set-Content -Path $issPath -Value $iss -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP 'VideoShelf-release-v1.7.10'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DSourceDir=$env:VIDEOSHELF_RELEASE_PACKAGE" "/DOutputDir=$out" "/DAppVersion=$env:RELEASE_VERSION" $issPath
          if ($LASTEXITCODE -ne 0) { throw 'Release installer compilation failed.' }
          $installer = Join-Path $out 'VideoShelf-Setup-v1.7.10.exe'
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) { throw 'Release installer was not created correctly.' }
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer SHA256: $hash"
          "VIDEOSHELF_RELEASE_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VIDEOSHELF_RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test clean install
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.10-clean-install'
          $install = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Clean install failed.' }
          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferExe = Join-Path $installDir 'TransferHost\VideoShelf.TransferHost.exe'
          $mainTest = Start-Process -FilePath $mainExe -ArgumentList '--self-test' -WorkingDirectory $installDir -Wait -PassThru
          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $transferExe) -Wait -PassThru
          if ($mainTest.ExitCode -ne 0 -or $transferTest.ExitCode -ne 0) { throw 'Installed release self-test failed.' }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Clean-install uninstall failed.' }

      - name: Test v1.7.9 upgrade and runtime replacement
        shell: powershell
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'VideoShelf-Setup-v1.7.9.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/x0XP/VideoShelf/releases/download/v1.7.9/VideoShelf-Setup-v1.7.9.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PREVIOUS_SHA256) { throw 'Unexpected v1.7.9 installer hash.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-v179-to-v1710-upgrade-test'
          $oldInstall = Start-Process -FilePath $previous -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'v1.7.9 install failed.' }
          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferDir = Join-Path $installDir 'TransferHost'
          $transferExe = Join-Path $transferDir 'VideoShelf.TransferHost.exe'
          $transferDll = Join-Path $transferDir 'VideoShelf.TransferHost.dll'
          'must disappear' | Set-Content (Join-Path $transferDir 'previous-runtime-sentinel.txt')
          $oldMain = Start-Process -FilePath $mainExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 2
          $oldHost = Start-Process -FilePath $transferExe -ArgumentList @('stream','--source','magnet:?xt=urn:btih:0123456789012345678901234567890123456789','--title','runtime-lock') -WorkingDirectory $transferDir -PassThru
          Start-Sleep -Seconds 2
          if ($oldMain.HasExited -or $oldHost.HasExited) { throw 'Previous runtime did not remain running for upgrade test.' }
          $upgrade = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/VIDEOSHELFUPDATE=1',('/DIR="' + $installDir + '"')) -PassThru
          $upgrade.WaitForExit()
          if ($upgrade.ExitCode -ne 0) { throw 'v1.7.9 -> v1.7.10 upgrade failed.' }
          try { $oldMain.Refresh() } catch {}; try { $oldHost.Refresh() } catch {}
          if (-not $oldMain.HasExited -or -not $oldHost.HasExited) { throw 'Upgrade did not terminate the old runtime.' }
          if (Test-Path (Join-Path $transferDir 'previous-runtime-sentinel.txt')) { throw 'Old TransferHost contents survived the upgrade.' }
          $expectedDll = Join-Path $env:VIDEOSHELF_RELEASE_PACKAGE 'TransferHost\VideoShelf.TransferHost.dll'
          if ((Get-FileHash $transferDll -Algorithm SHA256).Hash -ne (Get-FileHash $expectedDll -Algorithm SHA256).Hash) { throw 'Installed TransferHost does not match v1.7.10.' }
          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory $transferDir -Wait -PassThru
          if ($transferTest.ExitCode -ne 0) { throw 'TransferHost self-test failed after upgrade.' }
          Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'VideoShelf.TransferHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Upgrade regression uninstall failed.' }

      - name: Publish stable GitHub Release
        shell: powershell
        run: |
          $notes = @'
          ## VideoShelf v1.7.10

          - Improves online thumbnail relevance by carrying the originating search context into image lookup and ranking.
          - Uses a new contextual thumbnail cache so older mismatched previews are not reused.
          - Strengthens DuckDuckGo Safe Search-off requests while retaining original-image-first loading.
          - Slightly reduces image request frequency to avoid unnecessary search-engine bursts.
          - Retains episode-specific anime/TV thumbnail lookup and the stable streaming/runtime stack.

          Passed VideoShelf and TransferHost self-tests, clean install, v1.7.9 -> v1.7.10 in-place upgrade, runtime replacement and uninstall checks before publication.
          '@
          $notesFile = Join-Path $env:RUNNER_TEMP 'v1.7.10-notes.md'
          Set-Content $notesFile $notes -Encoding UTF8
          gh release create $env:RELEASE_TAG $env:VIDEOSHELF_RELEASE_INSTALLER --repo x0XP/VideoShelf --target $env:RELEASE_SOURCE --title 'VideoShelf v1.7.10' --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
