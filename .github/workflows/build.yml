name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build VideoShelf
        shell: cmd
        run: Start.cmd --build-only
      - name: Test folder creation with re:zero
        shell: cmd
        run: VideoShelf.exe --self-test
      - name: Publish bundled download and streaming runtime
        shell: powershell
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          "VIDEOSHELF_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test MonoTorrent and embedded LibVLC runtime
        shell: powershell
        run: |
          $transferExe = Join-Path $env:VIDEOSHELF_PACKAGE 'TransferHost\VideoShelf.TransferHost.exe'
          if (!(Test-Path $transferExe)) { throw 'TransferHost executable was not published.' }
          $process = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "TransferHost self-test failed with exit code $($process.ExitCode)." }
      - name: Render real Home screen
        shell: cmd
        run: VideoShelf.exe --screenshot-rezero "%RUNNER_TEMP%\VideoShelf-home.png"
      - name: Render real re:zero collection screen
        shell: cmd
        run: VideoShelf.exe --screenshot-rezero-detail "%RUNNER_TEMP%\VideoShelf-rezero-detail.png"
      - name: Attempt live re:zero torrent metadata proof without media download
        continue-on-error: true
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-online.png'
          $sources = @(
            'https://nyaa.media/?page=rss&q={query}&c=1_2&f=0',
            'https://nyaa.mom/?page=rss&q={query}&c=1_2&f=0',
            'https://nyaa.si/?page=rss&q={query}&c=1_2&f=0',
            'https://stremthrufortheweebs.midnightignite.me/v0/torznab/api',
            'https://www.torlock2.com/torznab/api'
          )
          $success = $false
          foreach ($source in $sources) {
            if (Test-Path $output) { Remove-Item $output -Force }
            $argumentList = @('--screenshot-online','"re:zero"','"re zero"',('"' + $source + '"'),('"' + $output + '"'),'1')
            $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList $argumentList -PassThru -NoNewWindow
            if (-not $process.WaitForExit(12000)) {
              Write-Host "Metadata source unavailable/timed out: $source"
              $process.Kill()
              $process.WaitForExit()
              continue
            }
            if ($process.ExitCode -eq 0 -and (Test-Path $output) -and (Get-Item $output).Length -gt 5000) {
              Write-Host "Captured live seeded torrent metadata from $source"
              $success = $true
              break
            }
          }
          if (-not $success) {
            Write-Warning 'Public metadata feeds were unreachable from this GitHub runner. No media fallback is used.'
            exit 1
          }
      - name: Verify required screenshots
        shell: powershell
        run: |
          $home = Join-Path $env:RUNNER_TEMP 'VideoShelf-home.png'
          $detail = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-detail.png'
          if (!(Test-Path $home)) { throw 'VideoShelf Home screenshot was not created.' }
          if (!(Test-Path $detail)) { throw 'VideoShelf re:zero detail screenshot was not created.' }
          if ((Get-Item $home).Length -lt 5000) { throw 'VideoShelf Home screenshot is unexpectedly small.' }
          if ((Get-Item $detail).Length -lt 5000) { throw 'VideoShelf re:zero detail screenshot is unexpectedly small.' }
          Copy-Item $home .\VideoShelf-home.png
          Copy-Item $detail .\VideoShelf-rezero-detail.png
          $online = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-online.png'
          if ((Test-Path $online) -and (Get-Item $online).Length -gt 5000) { Copy-Item $online .\VideoShelf-rezero-online.png }
      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-windows
          path: ${{ env.VIDEOSHELF_PACKAGE }}
          if-no-files-found: error
      - name: Upload available screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-screenshots
          path: VideoShelf-*.png
          if-no-files-found: error
