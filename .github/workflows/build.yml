name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VideoShelf
        shell: cmd
        run: Start.cmd --build-only
      - name: Test folder creation with re:zero
        shell: cmd
        run: VideoShelf.exe --self-test
      - name: Render real re:zero GUI screenshot
        shell: cmd
        run: VideoShelf.exe --screenshot-rezero "%RUNNER_TEMP%\VideoShelf-rezero.png"
      - name: Render live re:zero torrent results without media download
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-online.png'
          $sources = @(
            'https://bitmagnetfortheweebs.midnightignite.me/torznab/api',
            'https://www.torlock.com/torznab/api'
          )
          $success = $false
          foreach ($source in $sources) {
            if (Test-Path $output) { Remove-Item $output -Force }
            $argumentList = @('--screenshot-online','"re:zero"','"re zero"',$source,$output,'3')
            $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList $argumentList -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -eq 0 -and (Test-Path $output) -and (Get-Item $output).Length -gt 5000) {
              Write-Host "Captured live seeded torrent metadata from $source"
              $success = $true
              break
            }
          }
          if (-not $success) { throw 'No public Torznab source returned enough live seeded re:zero results for the screenshot.' }
      - name: Verify screenshots
        shell: powershell
        run: |
          $library = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero.png'
          $online = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-online.png'
          if (!(Test-Path $library)) { throw 'VideoShelf library screenshot was not created.' }
          if (!(Test-Path $online)) { throw 'VideoShelf live online-results screenshot was not created.' }
          if ((Get-Item $library).Length -lt 5000) { throw 'VideoShelf library screenshot is unexpectedly small.' }
          if ((Get-Item $online).Length -lt 5000) { throw 'VideoShelf live online-results screenshot is unexpectedly small.' }
          Copy-Item $library .\VideoShelf-rezero.png
          Copy-Item $online .\VideoShelf-rezero-online.png
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-windows
          path: VideoShelf.exe
          if-no-files-found: error
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-live-online-screenshots
          path: |
            VideoShelf-rezero.png
            VideoShelf-rezero-online.png
          if-no-files-found: error
