name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build VideoShelf
        shell: cmd
        run: Start.cmd --build-only

      - name: Verify VideoShelf application icon
        shell: powershell
        run: |
          if (!(Test-Path '.\VideoShelf.ico')) { throw 'VideoShelf.ico was not generated.' }
          if (!(Test-Path '.\VideoShelf.png')) { throw 'VideoShelf.png was not generated.' }
          if ((Get-Item '.\VideoShelf.ico').Length -lt 1000) { throw 'VideoShelf.ico is unexpectedly small.' }
          Add-Type -AssemblyName System.Drawing
          $brand = [System.Drawing.Bitmap]::FromFile((Resolve-Path '.\VideoShelf.png').Path)
          try {
            if ($brand.Width -ne 512 -or $brand.Height -ne 512) { throw 'VideoShelf.png is not the expected 512x512 master asset.' }
            if ($brand.GetPixel(0, 0).A -ne 0) { throw 'VideoShelf.png does not have a transparent background.' }
          } finally { $brand.Dispose() }
          function Assert-BrandedIcon([string]$Path) {
            $resolved = (Resolve-Path $Path).Path
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($resolved)
            if ($null -eq $icon) { throw "No Windows icon could be extracted from $Path" }
            $bitmap = $icon.ToBitmap()
            try {
              $red = 0; $blue = 0
              for ($x = 0; $x -lt $bitmap.Width; $x++) {
                for ($y = 0; $y -lt $bitmap.Height; $y++) {
                  $c = $bitmap.GetPixel($x, $y)
                  if ($c.A -gt 100 -and $c.R -gt 140 -and $c.R -gt ($c.G + 40) -and $c.R -gt ($c.B + 20)) { $red++ }
                  if ($c.A -gt 100 -and $c.B -gt 100 -and $c.B -gt ($c.R + 20)) { $blue++ }
                }
              }
              if ($red -lt 5 -or $blue -lt 20) { throw "The branded red/blue VideoShelf icon was not found in $Path (red=$red blue=$blue)." }
            } finally { $bitmap.Dispose(); $icon.Dispose() }
          }
          Assert-BrandedIcon '.\VideoShelf.exe'

      - name: Test folder aliases, metadata parser and search deadline
        shell: cmd
        run: VideoShelf.exe --self-test

      - name: Verify branded application shell renders
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-brand-shell.png'
          $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--screenshot-home-layout',('"' + $output + '"')) -PassThru -NoNewWindow
          if (-not $process.WaitForExit(30000)) {
            $process.Kill(); $process.WaitForExit()
            throw 'VideoShelf branded shell render exceeded 30 seconds.'
          }
          $process.WaitForExit()
          $process.Refresh()
          $exitCode = $process.ExitCode
          if ($exitCode -ne 0 -or !(Test-Path $output) -or (Get-Item $output).Length -lt 5000) {
            throw "VideoShelf branded shell render failed with exit code $exitCode."
          }

      - name: Attempt real built-in Find online screenshot
        id: live_builtin
        continue-on-error: true
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-built-in.png'
          $argumentList = @('--screenshot-built-in-online','"re:zero"','"re zero"',('"' + $output + '"'),'1')
          $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList $argumentList -PassThru -NoNewWindow
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            $process.WaitForExit()
            "status=timeout" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning 'Built-in Find online artwork-complete screenshot exceeded 90 seconds.'
            exit 1
          }
          if ($process.ExitCode -ne 0 -or !(Test-Path $output) -or (Get-Item $output).Length -lt 5000) {
            "status=unavailable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning "Built-in Find online screenshot failed with exit code $($process.ExitCode). Public metadata or image sources may be unavailable; placeholder artwork is not captured."
            exit 1
          }
          "status=ok" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host 'Built-in Find online rendered seeded results after the complete thumbnail pass finished.'

      - name: Fail if built-in Find online hung
        if: always() && steps.live_builtin.outputs.status == 'timeout'
        shell: powershell
        run: throw 'Built-in Find online capture exceeded its hard deadline. This is an application regression, not an optional public-source outage.'

      - name: Publish bundled download and streaming runtime
        shell: powershell
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          Copy-Item '.\VideoShelf.ico' (Join-Path $package 'VideoShelf.ico')
          Copy-Item '.\VideoShelf.png' (Join-Path $package 'VideoShelf.png')
          "VIDEOSHELF_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test MonoTorrent, LibVLC, transfer UI and transfer icon runtime
        shell: powershell
        run: |
          $transferExe = Join-Path $env:VIDEOSHELF_PACKAGE 'TransferHost\VideoShelf.TransferHost.exe'
          if (!(Test-Path $transferExe)) { throw 'TransferHost executable was not published.' }
          $process = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "TransferHost self-test failed with exit code $($process.ExitCode)." }
          foreach ($shot in @('VideoShelf-transfer-download.png','VideoShelf-transfer-player.png','VideoShelf-transfer-files.png')) {
            if (!(Test-Path $shot) -or (Get-Item $shot).Length -lt 5000) { throw "Transfer UI capture was not created correctly: $shot" }
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($transferExe)
          if ($null -eq $icon) { throw 'TransferHost has no embedded Windows icon.' }
          $bitmap = $icon.ToBitmap()
          try {
            $red = 0; $blue = 0
            for ($x = 0; $x -lt $bitmap.Width; $x++) {
              for ($y = 0; $y -lt $bitmap.Height; $y++) {
                $c = $bitmap.GetPixel($x, $y)
                if ($c.A -gt 100 -and $c.R -gt 140 -and $c.R -gt ($c.G + 40) -and $c.R -gt ($c.B + 20)) { $red++ }
                if ($c.A -gt 100 -and $c.B -gt 100 -and $c.B -gt ($c.R + 20)) { $blue++ }
              }
            }
            if ($red -lt 5 -or $blue -lt 20) { throw "TransferHost does not contain the VideoShelf branded icon (red=$red blue=$blue)." }
          } finally { $bitmap.Dispose(); $icon.Dispose() }

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $installerDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          & $iscc "/DSourceDir=$env:VIDEOSHELF_PACKAGE" "/DOutputDir=$installerDir" "/DAppVersion=1.7.0" '.\installer\VideoShelf.iss'
          if ($LASTEXITCODE -ne 0) { throw 'VideoShelf installer compilation failed.' }
          $installer = Join-Path $installerDir 'VideoShelf-Setup-v1.7.exe'
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) { throw 'VideoShelf installer was not created correctly.' }
          Copy-Item '.\VideoShelf.ico' (Join-Path $installerDir 'VideoShelf.ico')
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($installer)
          if ($null -eq $icon) { throw 'The installer has no embedded Windows icon.' }
          $bitmap = $icon.ToBitmap()
          try {
            $red = 0; $blue = 0
            for ($x = 0; $x -lt $bitmap.Width; $x++) {
              for ($y = 0; $y -lt $bitmap.Height; $y++) {
                $c = $bitmap.GetPixel($x, $y)
                if ($c.A -gt 100 -and $c.R -gt 140 -and $c.R -gt ($c.G + 40) -and $c.R -gt ($c.B + 20)) { $red++ }
                if ($c.A -gt 100 -and $c.B -gt 100 -and $c.B -gt ($c.R + 20)) { $blue++ }
              }
            }
            if ($red -lt 5 -or $blue -lt 20) { throw "The installer does not contain the VideoShelf branded icon (red=$red blue=$blue)." }
          } finally { $bitmap.Dispose(); $icon.Dispose() }
          "VIDEOSHELF_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VIDEOSHELF_INSTALLER_DIR=$installerDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test silent installer and uninstaller
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-install-test'
          $installLog = Join-Path $env:RUNNER_TEMP 'VideoShelf-install.log'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"'),('/LOG="' + $installLog + '"'))
          $process = Start-Process -FilePath $env:VIDEOSHELF_INSTALLER -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $iconFile = Join-Path $installDir 'VideoShelf.ico'
          $brandPng = Join-Path $installDir 'VideoShelf.png'
          $transferExe = Join-Path $installDir 'TransferHost\VideoShelf.TransferHost.exe'
          if (!(Test-Path $mainExe)) { throw 'Installed VideoShelf.exe was not found.' }
          if (!(Test-Path $iconFile)) { throw 'Installed VideoShelf.ico was not found.' }
          if (!(Test-Path $brandPng)) { throw 'Installed VideoShelf.png was not found.' }
          if (!(Test-Path $transferExe)) { throw 'Installed TransferHost runtime was not found.' }
          $selfTest = Start-Process -FilePath $mainExe -ArgumentList '--self-test' -WorkingDirectory $installDir -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Installed VideoShelf self-test failed with exit code $($selfTest.ExitCode)." }
          $runtimeTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $transferExe) -Wait -PassThru
          if ($runtimeTest.ExitCode -ne 0) { throw "Installed TransferHost self-test failed with exit code $($runtimeTest.ExitCode)." }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'VideoShelf uninstaller was not registered.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }
          Start-Sleep -Seconds 1
          if (Test-Path $mainExe) { throw 'VideoShelf.exe remained after silent uninstall.' }
          if (Test-Path $transferExe) { throw 'TransferHost remained after silent uninstall.' }

      - name: Render deterministic Home layout
        shell: cmd
        run: VideoShelf.exe --screenshot-home-layout "%RUNNER_TEMP%\VideoShelf-home-layout.png"

      - name: Attempt real re:zero artwork proof
        continue-on-error: true
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-home-live.png'
          $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--screenshot-rezero',('"' + $output + '"')) -PassThru -NoNewWindow
          if (-not $process.WaitForExit(65000)) {
            $process.Kill(); $process.WaitForExit()
            Write-Warning 'Real artwork lookup exceeded 65 seconds; layout validation continues independently.'
            exit 1
          }
          if ($process.ExitCode -ne 0 -or !(Test-Path $output) -or (Get-Item $output).Length -lt 5000) {
            Write-Warning 'Real artwork source was unavailable or blocked. No fake artwork is substituted.'
            exit 1
          }

      - name: Render real re:zero collection screen
        shell: cmd
        run: VideoShelf.exe --screenshot-rezero-detail "%RUNNER_TEMP%\VideoShelf-rezero-detail.png"

      - name: Render search-layout visual regression
        shell: cmd
        run: VideoShelf.exe --screenshot-mockup-search "%RUNNER_TEMP%\VideoShelf-search-layout.png"

      - name: Verify required screenshots
        shell: powershell
        run: |
          $homeShot = Join-Path $env:RUNNER_TEMP 'VideoShelf-home-layout.png'
          $detailShot = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-detail.png'
          $searchShot = Join-Path $env:RUNNER_TEMP 'VideoShelf-search-layout.png'
          if (!(Test-Path $homeShot)) { throw 'VideoShelf Home layout screenshot was not created.' }
          if (!(Test-Path $detailShot)) { throw 'VideoShelf re:zero detail screenshot was not created.' }
          if (!(Test-Path $searchShot)) { throw 'VideoShelf search-layout screenshot was not created.' }
          if ((Get-Item $homeShot).Length -lt 5000) { throw 'VideoShelf Home layout screenshot is unexpectedly small.' }
          if ((Get-Item $detailShot).Length -lt 5000) { throw 'VideoShelf re:zero detail screenshot is unexpectedly small.' }
          if ((Get-Item $searchShot).Length -lt 12000) { throw 'VideoShelf search-layout screenshot is unexpectedly small.' }
          Copy-Item $homeShot .\VideoShelf-home-layout.png
          Copy-Item $detailShot .\VideoShelf-rezero-detail.png
          Copy-Item $searchShot .\VideoShelf-search-layout.png
          $homeLive = Join-Path $env:RUNNER_TEMP 'VideoShelf-home-live.png'
          if ((Test-Path $homeLive) -and (Get-Item $homeLive).Length -gt 5000) { Copy-Item $homeLive .\VideoShelf-home-live.png }
          $builtIn = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-built-in.png'
          if ((Test-Path $builtIn) -and (Get-Item $builtIn).Length -gt 5000) { Copy-Item $builtIn .\VideoShelf-rezero-built-in.png }

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-windows
          path: ${{ env.VIDEOSHELF_PACKAGE }}
          if-no-files-found: error

      - name: Upload tested Windows installer and icon
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-installer
          path: ${{ env.VIDEOSHELF_INSTALLER_DIR }}
          if-no-files-found: error

      - name: Upload available screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-screenshots
          path: VideoShelf-*.png
          if-no-files-found: error
