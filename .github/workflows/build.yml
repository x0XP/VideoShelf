name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VideoShelf
        shell: cmd
        run: Start.cmd --build-only
      - name: Test folder creation with re:zero
        shell: cmd
        run: VideoShelf.exe --self-test
      - name: Render real re:zero GUI screenshot
        shell: cmd
        run: VideoShelf.exe --screenshot-rezero "%RUNNER_TEMP%\VideoShelf-rezero.png"
      - name: Attempt live re:zero torrent metadata proof without media download
        continue-on-error: true
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-online.png'
          $sources = @(
            'https://nyaa.si/?page=rss&q={query}&c=1_2&f=0',
            'https://stremthrufortheweebs.midnightignite.me/v0/torznab/api',
            'https://www.torlock.com/torznab/api'
          )
          $success = $false
          foreach ($source in $sources) {
            if (Test-Path $output) { Remove-Item $output -Force }
            $argumentList = @('--screenshot-online','"re:zero"','"re zero"',('"' + $source + '"'),('"' + $output + '"'),'1')
            $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList $argumentList -PassThru -NoNewWindow
            if (-not $process.WaitForExit(15000)) {
              Write-Host "Metadata source unavailable/timed out: $source"
              $process.Kill()
              $process.WaitForExit()
              continue
            }
            if ($process.ExitCode -eq 0 -and (Test-Path $output) -and (Get-Item $output).Length -gt 5000) {
              Write-Host "Captured live seeded torrent metadata from $source"
              $success = $true
              break
            }
          }
          if (-not $success) {
            Write-Warning 'Public metadata feeds were unreachable from this GitHub runner. The compile/self-test remains authoritative; no media fallback is used.'
            exit 1
          }
      - name: Verify required screenshot
        shell: powershell
        run: |
          $library = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero.png'
          if (!(Test-Path $library)) { throw 'VideoShelf library screenshot was not created.' }
          if ((Get-Item $library).Length -lt 5000) { throw 'VideoShelf library screenshot is unexpectedly small.' }
          Copy-Item $library .\VideoShelf-rezero.png
          $online = Join-Path $env:RUNNER_TEMP 'VideoShelf-rezero-online.png'
          if ((Test-Path $online) -and (Get-Item $online).Length -gt 5000) {
            Copy-Item $online .\VideoShelf-rezero-online.png
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-windows
          path: VideoShelf.exe
          if-no-files-found: error
      - name: Upload available screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-screenshots
          path: VideoShelf-*.png
          if-no-files-found: error
