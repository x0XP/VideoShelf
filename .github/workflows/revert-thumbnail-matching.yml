name: Revert thumbnail matching hardening

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/revert-thumbnail-matching.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert only thumbnail relevance hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit e70eded959d8fb18dfb5f1608634c424326c4cb4
          git commit --amend -m 'Revert strict thumbnail relevance matching'
          git push
