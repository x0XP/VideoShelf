name: Improve thumbnail context

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/improve-thumbnail-context.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply contextual thumbnail lookup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          d=lambda x: base64.b64decode(x).decode('utf-8')
          p=Path('src/VideoShelf/Search/OnlineThumbnailLookup.cs')
          s=p.read_text(encoding='utf-8')
          reps=[
          ('',''),
          ('',''),
          ('IHN0YXRpYyBhc3luYyBUYXNrPExpc3Q8RGljdGlvbmFyeTxzdHJpbmcsb2JqZWN0Pj4+IFNlYXJjaFJvd3Moc3RyaW5nIHF1ZXJ5LENhbmNlbGxhdGlvblRva2VuIGN0KXsKICBzdHJpbmcgaHRtbD1FbmNvZGluZy5VVEY4LkdldFN0cmluZyhhd2FpdCBHZXQoU2VhcmNoVXJsRm9yKHF1ZXJ5KSwyKjEwMjQqMTAyNCxjdCkuQ29uZmlndXJlQXdhaXQoZmFsc2UpKTsK',''),
          ('IHN0YXRpYyB2b2lkIFN0b3JlKHN0cmluZyB0aXRsZSxJbWFnZSBpbWFnZSxzdHJpbmcgc291cmNlKXsKICBEaXJlY3RvcnkuQ3JlYXRlRGlyZWN0b3J5KGNhY2hlKTtzdHJpbmcgZj1GaWxlRm9yKHRpdGxlKSx0ZW1wPWYrIi4iK0d1aWQuTmV3R3VpZCgpLlRvU3RyaW5nKCJOIikrIi50bXAiOwo=','IHN0YXRpYyB2b2lkIFN0b3JlKHN0cmluZyB0aXRsZSxzdHJpbmcgY29udGV4dCxJbWFnZSBpbWFnZSxzdHJpbmcgc291cmNlKXsKICBEaXJlY3RvcnkuQ3JlYXRlRGlyZWN0b3J5KGNhY2hlKTtzdHJpbmcgZj1GaWxlRm9yKHRpdGxlLGNvbnRleHQpLHRlbXA9ZisiLiIrR3VpZC5OZXdHdWlkKCkuVG9TdHJpbmcoIk4iKSsiLnRtcCI7Cg=='),
          ('',''),
          ('IHB1YmxpYyBzdGF0aWMgYXN5bmMgVGFzazxPbmxpbmVUaHVtYm5haWxSZXN1bHQ+IEZpbmQoc3RyaW5nIHRpdGxlLENhbmNlbGxhdGlvblRva2VuIGN0KXsKICBhd2FpdCBnYXRlLldhaXRBc3luYyhjdCkuQ29uZmlndXJlQXdhaXQoZmFsc2UpOwogIHRyeXsKICAgY3QuVGhyb3dJZkNhbmNlbGxhdGlvblJlcXVlc3RlZCgpO3N0cmluZyBmPUZpbGVGb3IodGl0bGUpOwo=',''),
          ('','')]
          for a,b in reps:
              old,new=d(a),d(b)
              if old not in s: raise SystemExit('source block not found')
              s=s.replace(old,new,1)
          s=s.replace('Uri.EscapeDataString(query)+"&vqd="','Uri.EscapeDataString(effectiveQuery)+"&vqd="',1)
          s=s.replace('try{Store(title,framed,source);}catch{}','try{Store(title,context,framed,source);}catch{}',1)
          s=s.replace('FindFromQuery(title,id,PrimaryQuery(id),ct)','FindFromQuery(title,context,id,PrimaryQuery(id,context),ct)')
          s=s.replace('FindFromQuery(title,id,SecondaryQuery(id),ct)','FindFromQuery(title,context,id,SecondaryQuery(id,context),ct)')
          p.write_text(s,encoding='utf-8')
          p=Path('src/VideoShelf/UI/Shelf/Shelf.Online.cs')
          s=p.read_text(encoding='utf-8')
          a=d('')
          b=d('')
          if a not in s: raise SystemExit('loader block not found')
          s=s.replace(a,b,1)
          s=s.replace('OnlineThumbnailLookup.CacheKey(row.Title)','OnlineThumbnailLookup.CacheKey(row.Title,thumbnailContext)')
          s=s.replace('OnlineThumbnailLookup.Find(row.Title,ct)','OnlineThumbnailLookup.Find(row.Title,thumbnailContext,ct)')
          s=s.replace('OnlineThumbnailLookup.CacheKey(x.Title)==key','OnlineThumbnailLookup.CacheKey(x.Title,thumbnailContext)==key')
          s=s.replace('OnlineThumbnailLookup.CacheKey(c.Result.Title)==key','OnlineThumbnailLookup.CacheKey(c.Result.Title,thumbnailContext)==key')
          s=s.replace('OnlineThumbnailLookup.CacheKey(selectedOnline.Title)==key','OnlineThumbnailLookup.CacheKey(selectedOnline.Title,thumbnailContext)==key')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit source update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VideoShelf/Search/OnlineThumbnailLookup.cs src/VideoShelf/UI/Shelf/Shelf.Online.cs
          git commit -m 'Use search context for thumbnail lookups'
          git push
