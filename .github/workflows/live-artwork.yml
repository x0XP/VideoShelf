name: Live artwork regression

on:
  push:
    branches: [ main ]
    paths:
      - 'src/VideoShelf/**'
      - 'Start.cmd'
      - '.github/workflows/live-artwork.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/VideoShelf/**'
      - 'Start.cmd'
      - '.github/workflows/live-artwork.yml'

jobs:
  artwork:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build VideoShelf
        shell: cmd
        run: Start.cmd --build-only

      - name: Require a live online-result artwork image
        shell: powershell
        run: |
          $queries = @('Re Zero anime','Windows 11 wallpaper','Big Buck Bunny')
          $success = $false
          foreach ($query in $queries) {
            Write-Host "Testing online-result artwork for: $query"
            $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--test-online-artwork',('"' + $query + '"')) -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -eq 0) {
              $success = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $success) {
            throw 'All live online-result artwork lookups failed. VideoShelf would display blank result screenshots.'
          }

      - name: Require collection artwork to render in the UI
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-live-artwork.png'
          $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--screenshot-rezero',('"' + $output + '"')) -PassThru -NoNewWindow
          $finished = $process.WaitForExit(90000)
          if (-not $finished) {
            try { $process.Kill() } catch {}
            try { $process.WaitForExit() } catch {}
            throw 'Collection artwork UI render exceeded 90 seconds.'
          }
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 5000) {
            throw 'Collection artwork UI render did not create a valid screenshot with real artwork.'
          }
          Copy-Item $output '.\VideoShelf-live-artwork.png'

      - uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-live-artwork-proof
          path: VideoShelf-live-artwork.png
          if-no-files-found: error
