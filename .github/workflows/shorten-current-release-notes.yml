name: Shorten current release notes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/shorten-current-release-notes.yml'

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## VideoShelf v1.7.10

          - Better image matching, including episode-specific thumbnails.
          - Improved image quality, caching and Safe Search-off handling.
          EOF
          gh release edit v1.7.10 --repo x0XP/VideoShelf --notes-file "$RUNNER_TEMP/release-notes.md"
