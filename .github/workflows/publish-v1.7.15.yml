name: Publish VideoShelf v1.7.15

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.7.15.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: 1.7.15
      RELEASE_TAG: v1.7.15
      RELEASE_SOURCE: 01e8c8fab2a4e9120c63e89afec0f4133841bc47
      PREVIOUS_VERSION: 1.7.14
      PREVIOUS_TAG: v1.7.14
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 01e8c8fab2a4e9120c63e89afec0f4133841bc47
          fetch-depth: 1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify approved source
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SOURCE) { throw "Expected source $env:RELEASE_SOURCE but checked out $head." }
          $source = Get-Content '.\src\VideoShelf\Application\AppVersion.cs' -Raw
          $match = [regex]::Match($source, 'Current\s*=\s*"([0-9]+(?:\.[0-9]+){1,3})"')
          if (-not $match.Success -or $match.Groups[1].Value -ne $env:RELEASE_VERSION) { throw 'AppVersion.Current does not match the release version.' }
          $changelog = Get-Content '.\CHANGELOG.md' -Raw
          if (-not $changelog.StartsWith('VideoShelf 1.7.15')) { throw 'CHANGELOG.md does not start with the v1.7.15 release notes.' }

      - name: Build and self-test VideoShelf
        shell: powershell
        run: |
          cmd /c Start.cmd --build-only
          if ($LASTEXITCODE -ne 0) { throw 'VideoShelf build failed.' }
          $test = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) { throw 'VideoShelf self-test failed.' }

      - name: Require live online-result artwork
        shell: powershell
        run: |
          $queries = @('Re Zero anime','Windows 11 wallpaper','Big Buck Bunny')
          $success = $false
          foreach ($query in $queries) {
            $test = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--test-online-artwork',('"' + $query + '"')) -Wait -PassThru -NoNewWindow
            if ($test.ExitCode -eq 0) { $success = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $success) { throw 'Live online-result artwork lookup failed for every release probe.' }

      - name: Require live collection artwork render
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.15-live-collection.png'
          $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--screenshot-rezero',('"' + $output + '"')) -PassThru -NoNewWindow
          if (-not $process.WaitForExit(90000)) { try { $process.Kill() } catch {}; throw 'Live collection artwork render timed out.' }
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 5000) { throw 'Live collection artwork screenshot was not created correctly.' }

      - name: Require built-in online result screenshots
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.15-online-results.png'
          $process = Start-Process -FilePath '.\VideoShelf.exe' -ArgumentList @('--screenshot-built-in-online','"re:zero"','"re zero"',('"' + $output + '"'),'1') -PassThru -NoNewWindow
          if (-not $process.WaitForExit(90000)) { try { $process.Kill() } catch {}; throw 'Built-in online screenshot proof timed out.' }
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 5000) { throw 'Built-in online screenshot proof was not created correctly.' }

      - name: Publish and self-test transfer runtime
        shell: powershell
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.15-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\src\VideoShelf.TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          Copy-Item '.\VideoShelf.ico' (Join-Path $package 'VideoShelf.ico')
          Copy-Item '.\VideoShelf.png' (Join-Path $package 'VideoShelf.png')
          $test = Start-Process -FilePath (Join-Path $transferDir 'VideoShelf.TransferHost.exe') -ArgumentList '--self-test' -WorkingDirectory $transferDir -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'TransferHost self-test failed.' }
          foreach ($shot in @('VideoShelf-transfer-download.png','VideoShelf-transfer-player.png','VideoShelf-transfer-files.png')) {
            $shotPath = Join-Path $transferDir $shot
            if (!(Test-Path $shotPath) -or (Get-Item $shotPath).Length -lt 5000) { throw "Transfer UI capture was not created correctly: $shotPath" }
          }
          "VIDEOSHELF_RELEASE_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exact v1.7.15 installer
        shell: powershell
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found.' }
          $parts = $env:RELEASE_VERSION.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $fileVersion = ($parts[0..3] -join '.')
          $issPath = '.\installer\VideoShelf.release-v1.7.15.iss'
          $iss = Get-Content '.\installer\VideoShelf.iss' -Raw
          $iss = [regex]::Replace($iss, '(?m)^OutputBaseFilename=.*$', "OutputBaseFilename=VideoShelf-Setup-v$env:RELEASE_VERSION")
          $iss = [regex]::Replace($iss, '(?m)^VersionInfoVersion=.*$', "VersionInfoVersion=$fileVersion")
          Set-Content -Path $issPath -Value $iss -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.15-release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DSourceDir=$env:VIDEOSHELF_RELEASE_PACKAGE" "/DOutputDir=$out" "/DAppVersion=$env:RELEASE_VERSION" $issPath
          if ($LASTEXITCODE -ne 0) { throw 'Release installer compilation failed.' }
          $installer = Join-Path $out ("VideoShelf-Setup-v{0}.exe" -f $env:RELEASE_VERSION)
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) { throw 'Release installer was not created correctly.' }
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "v1.7.15 installer SHA-256: $hash"
          "VIDEOSHELF_RELEASE_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VIDEOSHELF_RELEASE_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test clean install
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.15-clean-install'
          $install = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Clean install failed with exit code $($install.ExitCode)." }
          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferExe = Join-Path $installDir 'TransferHost\VideoShelf.TransferHost.exe'
          if (!(Test-Path $mainExe) -or !(Test-Path $transferExe)) { throw 'Clean installation is incomplete.' }
          $mainTest = Start-Process -FilePath $mainExe -ArgumentList '--self-test' -WorkingDirectory $installDir -Wait -PassThru
          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $transferExe) -Wait -PassThru
          if ($mainTest.ExitCode -ne 0 -or $transferTest.ExitCode -ne 0) { throw 'Clean installed runtime self-test failed.' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Clean uninstall test failed.' }

      - name: Test v1.7.14 to v1.7.15 running upgrade
        shell: powershell
        run: |
          $headers = @{ 'User-Agent' = 'VideoShelf-v1.7.15-publisher' }
          $previous = Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/x0XP/VideoShelf/releases/latest'
          if ($previous.tag_name -ne $env:PREVIOUS_TAG) { throw "Expected previous public release $env:PREVIOUS_TAG but found $($previous.tag_name)." }
          $previousName = "VideoShelf-Setup-v$env:PREVIOUS_VERSION.exe"
          $asset = @($previous.assets | Where-Object { $_.name -eq $previousName }) | Select-Object -First 1
          if ($null -eq $asset) { throw "$previousName was not found on the previous release." }
          $previousInstaller = Join-Path $env:RUNNER_TEMP $previousName
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $asset.browser_download_url -OutFile $previousInstaller
          if (-not [string]::IsNullOrWhiteSpace($asset.digest) -and $asset.digest -like 'sha256:*') {
            $actualHash = (Get-FileHash $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedHash = $asset.digest.Substring(7).ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "Previous installer hash mismatch: expected $expectedHash got $actualHash" }
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.14-to-v1.7.15'
          $oldInstall = Start-Process -FilePath $previousInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'v1.7.14 install failed.' }
          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferDir = Join-Path $installDir 'TransferHost'
          $transferExe = Join-Path $transferDir 'VideoShelf.TransferHost.exe'
          $transferDll = Join-Path $transferDir 'VideoShelf.TransferHost.dll'
          'must be removed during upgrade' | Set-Content -Path (Join-Path $transferDir 'upgrade-sentinel.txt') -Encoding ASCII
          $oldMain = Start-Process -FilePath $mainExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 2
          if ($oldMain.HasExited) { throw 'v1.7.14 VideoShelf did not remain running for the upgrade test.' }
          $oldHost = Start-Process -FilePath $transferExe -ArgumentList @('stream','--source','magnet:?xt=urn:btih:0123456789012345678901234567890123456789','--title','UpgradeRegression') -WorkingDirectory $transferDir -PassThru
          Start-Sleep -Seconds 2
          if ($oldHost.HasExited) { throw 'v1.7.14 TransferHost did not remain running for the upgrade test.' }
          $upgrade = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/VIDEOSHELFUPDATE=1',('/DIR="' + $installDir + '"')) -PassThru
          $upgrade.WaitForExit()
          if ($upgrade.ExitCode -ne 0) { throw "v1.7.14 -> v1.7.15 upgrade failed with exit code $($upgrade.ExitCode)." }
          try { $oldMain.Refresh() } catch { }
          if (-not $oldMain.HasExited) { Stop-Process -Id $oldMain.Id -Force -ErrorAction SilentlyContinue; throw 'Old VideoShelf process survived the upgrade.' }
          try { $oldHost.Refresh() } catch { }
          if (-not $oldHost.HasExited) { Stop-Process -Id $oldHost.Id -Force -ErrorAction SilentlyContinue; throw 'Old TransferHost process survived the upgrade.' }
          if (Test-Path (Join-Path $transferDir 'upgrade-sentinel.txt')) { throw 'Old TransferHost runtime contents survived the upgrade.' }
          $expectedDll = Join-Path $env:VIDEOSHELF_RELEASE_PACKAGE 'TransferHost\VideoShelf.TransferHost.dll'
          if ((Get-FileHash $expectedDll -Algorithm SHA256).Hash -ne (Get-FileHash $transferDll -Algorithm SHA256).Hash) { throw 'Installed TransferHost runtime does not match v1.7.15.' }
          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory $transferDir -Wait -PassThru
          if ($transferTest.ExitCode -ne 0) { throw 'TransferHost self-test failed after upgrade.' }
          $restarted = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ([DateTime]::UtcNow -lt $deadline -and $null -eq $restarted) {
            $restarted = Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $mainExe -and $_.Id -ne $oldMain.Id } catch { $false } } | Select-Object -First 1
            if ($null -eq $restarted) { Start-Sleep -Milliseconds 500 }
          }
          if ($null -eq $restarted) { throw 'v1.7.15 did not relaunch after the upgrade.' }
          Start-Sleep -Seconds 2
          if ($restarted.HasExited) { throw 'Relaunched v1.7.15 exited immediately.' }
          Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $mainExe } catch { $false } } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'VideoShelf.TransferHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall after upgrade test failed.' }

      - name: Publish v1.7.15
        shell: powershell
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'v1.7.15-notes.md'
          @'
          ## VideoShelf v1.7.15

          - Restores online-result screenshots/thumbnails and collection artwork.
          - Uses browser-compatible image requests with DuckDuckGo-to-Bing fallback.
          - Tries both original images and provider thumbnails so one blocked URL cannot blank an entire result.
          - Falls back to the active search context when a specific torrent/release title is too restrictive to find artwork, preventing blank result cards.
          - Adds a required live-artwork regression that fetches and renders real artwork before image changes can pass.
          - Includes the v1.7.14 update-relaunch hardening and v1.7.13 compact subtitle/volume player controls.
          '@ | Set-Content -Path $notes -Encoding UTF8
          gh release create $env:RELEASE_TAG $env:VIDEOSHELF_RELEASE_INSTALLER --repo x0XP/VideoShelf --target $env:RELEASE_SOURCE --title 'VideoShelf v1.7.15' --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
