name: Fix DuckDuckGo image results

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-ddg-image-results.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Safe Search and original image preference
        shell: pwsh
        run: |
          $portraitPath = 'src/VideoShelf/Search/PortraitLookup.cs'
          $thumbPath = 'src/VideoShelf/Search/OnlineThumbnailLookup.cs'

          $portrait = Get-Content -Raw $portraitPath
          $thumb = Get-Content -Raw $thumbPath

          $portrait = $portrait.Replace('&p=1&kp=-2', '&p=-2&kp=-2')
          $thumb = $thumb.Replace('&p=1&kp=-2', '&p=-2&kp=-2')

          $oldPortrait = 'string image=Value(row,"thumbnail");if(image.Length==0)image=Value(row,"image");if(image.Length==0)continue;'
          $newPortrait = 'string image=Value(row,"image");if(image.Length==0)image=Value(row,"thumbnail");if(image.Length==0)continue;'
          if (-not $portrait.Contains($oldPortrait)) { throw 'Portrait image preference was not found.' }
          $portrait = $portrait.Replace($oldPortrait, $newPortrait)

          $oldThumb = 'ct.ThrowIfCancellationRequested();string image=Value(candidate.Row,"thumbnail");if(image.Length==0)image=Value(candidate.Row,"image");if(image.Length==0)continue;'
          $newThumb = 'ct.ThrowIfCancellationRequested();string image=Value(candidate.Row,"image");if(image.Length==0)image=Value(candidate.Row,"thumbnail");if(image.Length==0)continue;'
          if (-not $thumb.Contains($oldThumb)) { throw 'Online thumbnail image preference was not found.' }
          $thumb = $thumb.Replace($oldThumb, $newThumb)

          $oldCache = 'string key=Identify(title).CacheIdentity;'
          $newCache = 'string key="v2|"+Identify(title).CacheIdentity;'
          if (-not $thumb.Contains($oldCache)) { throw 'Online thumbnail cache key was not found.' }
          $thumb = $thumb.Replace($oldCache, $newCache)

          if ($portrait.Contains('&p=1&kp=-2') -or $thumb.Contains('&p=1&kp=-2')) { throw 'Strict image endpoint Safe Search parameter is still present.' }
          if (-not $portrait.Contains('&p=-2&kp=-2') -or -not $thumb.Contains('&p=-2&kp=-2')) { throw 'Safe Search off image endpoint parameter is missing.' }
          if (-not $portrait.Contains('string image=Value(row,"image");if(image.Length==0)image=Value(row,"thumbnail")')) { throw 'Portrait original image preference was not applied.' }
          if (-not $thumb.Contains('string image=Value(candidate.Row,"image");if(image.Length==0)image=Value(candidate.Row,"thumbnail")')) { throw 'Online original image preference was not applied.' }
          if (-not $thumb.Contains('string key="v2|"+Identify(title).CacheIdentity;')) { throw 'Thumbnail cache version was not applied.' }

          Set-Content -Path $portraitPath -Value $portrait -NoNewline
          Set-Content -Path $thumbPath -Value $thumb -NoNewline

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $portraitPath $thumbPath
          git diff --cached --exit-code && throw 'No DuckDuckGo image result changes were made.'
          git commit -m 'Fix DuckDuckGo Safe Search and blurred thumbnails'
          git push
