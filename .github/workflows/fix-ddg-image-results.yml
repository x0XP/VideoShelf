name: Fix DuckDuckGo image results

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-ddg-image-results.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Safe Search and original image preference
        shell: pwsh
        run: |
          $portraitPath = 'src/VideoShelf/Search/PortraitLookup.cs'
          $thumbPath = 'src/VideoShelf/Search/OnlineThumbnailLookup.cs'

          $portrait = Get-Content -Raw $portraitPath
          $thumb = Get-Content -Raw $thumbPath

          $portrait = $portrait.Replace('&p=1&kp=-2', '&p=-2&kp=-2')
          $thumb = $thumb.Replace('&p=1&kp=-2', '&p=-2&kp=-2')

          $oldPortrait = '   if(++tried>8)break;string image=Value(row,"thumbnail");if(image.Length==0)image=Value(row,"image");if(image.Length==0)continue;`n   try{var photo=Decode(await Get(image,5*1024*1024,ct).ConfigureAwait(false));return new PortraitResult{Photo=photo,Source=Value(row,"url")};}`n   catch(OperationCanceledException){throw;}catch(LookupBlockedException){throw;}catch{}'
          $newPortrait = '   if(++tried>8)break;string original=Value(row,"image"),thumbnail=Value(row,"thumbnail");`n   string[] images=new[]{original,thumbnail}.Where(x=>x.Length>0).Distinct(StringComparer.OrdinalIgnoreCase).ToArray();`n   foreach(string image in images){`n    try{var photo=Decode(await Get(image,5*1024*1024,ct).ConfigureAwait(false));return new PortraitResult{Photo=photo,Source=Value(row,"url")};}`n    catch(OperationCanceledException){throw;}catch(LookupBlockedException){throw;}catch{}`n   }'
          if (-not $portrait.Contains($oldPortrait)) { throw 'Portrait image selection block was not found.' }
          $portrait = $portrait.Replace($oldPortrait, $newPortrait)

          $oldThumb = '  foreach(var candidate in ranked){`n   ct.ThrowIfCancellationRequested();string image=Value(candidate.Row,"thumbnail");if(image.Length==0)image=Value(candidate.Row,"image");if(image.Length==0)continue;`n   try{`n    Image framed=DecodeAndFrame(await Get(image,5*1024*1024,ct).ConfigureAwait(false));`n    string source=Value(candidate.Row,"url");try{Store(title,framed,source);}catch{}`n    return new OnlineThumbnailResult{Image=framed,Source=source};`n   }catch(OperationCanceledException){throw;}catch(LookupBlockedException){throw;}catch{}`n  }'
          $newThumb = '  foreach(var candidate in ranked){`n   ct.ThrowIfCancellationRequested();string original=Value(candidate.Row,"image"),thumbnail=Value(candidate.Row,"thumbnail");`n   string[] images=new[]{original,thumbnail}.Where(x=>x.Length>0).Distinct(StringComparer.OrdinalIgnoreCase).ToArray();`n   foreach(string image in images){`n    try{`n     Image framed=DecodeAndFrame(await Get(image,5*1024*1024,ct).ConfigureAwait(false));`n     string source=Value(candidate.Row,"url");try{Store(title,framed,source);}catch{}`n     return new OnlineThumbnailResult{Image=framed,Source=source};`n    }catch(OperationCanceledException){throw;}catch(LookupBlockedException){throw;}catch{}`n   }`n  }'
          if (-not $thumb.Contains($oldThumb)) { throw 'Online thumbnail image selection block was not found.' }
          $thumb = $thumb.Replace($oldThumb, $newThumb)

          $oldCache = '  string key=Identify(title).CacheIdentity;'
          $newCache = '  string key="v2|"+Identify(title).CacheIdentity;'
          if (-not $thumb.Contains($oldCache)) { throw 'Online thumbnail cache key was not found.' }
          $thumb = $thumb.Replace($oldCache, $newCache)

          if ($portrait -match '&p=1&kp=-2' -or $thumb -match '&p=1&kp=-2') { throw 'Strict image endpoint Safe Search parameter is still present.' }
          if ($portrait -notmatch '&p=-2&kp=-2' -or $thumb -notmatch '&p=-2&kp=-2') { throw 'Safe Search off image endpoint parameter is missing.' }

          Set-Content -Path $portraitPath -Value $portrait -NoNewline
          Set-Content -Path $thumbPath -Value $thumb -NoNewline

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $portraitPath $thumbPath
          git diff --cached --exit-code && throw 'No DuckDuckGo image result changes were made.'
          git commit -m 'Fix DuckDuckGo Safe Search and blurred thumbnails'
          git push
