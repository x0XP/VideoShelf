name: Apply previous-release upgrade fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-previous-release-upgrade-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply upgrade regression fix
        run: python .github/scripts/fix_previous_release_upgrade.py
      - name: Commit upgrade regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-relaunch.yml
          git commit -m "Test upgrades from latest public release"
          git push origin main
