name: Apply compact player controls

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-compact-player-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Wire compact controls into stream form
        shell: pwsh
        run: |
          $path = 'src/VideoShelf.TransferHost/Player/OptimizedStreamForm.cs'
          $text = Get-Content $path -Raw
          $old = @'
          Resize += (_, _) => LayoutPlayer();
          LayoutPlayer();
          '@
          $new = @'
          InitializeCompactPlayerControls(bottom);
          Resize += (_, _) => { LayoutPlayer(); LayoutCompactPlayerControls(); };
          LayoutPlayer();
          LayoutCompactPlayerControls();
          '@
          if (-not $text.Contains($old)) { throw 'Expected player layout block was not found.' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -NoNewline -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'Use compact subtitle and volume player controls'
          git push origin HEAD:main
