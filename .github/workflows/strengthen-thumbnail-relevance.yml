name: Strengthen thumbnail relevance

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/strengthen-thumbnail-relevance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Harden DuckDuckGo thumbnail matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('src/VideoShelf/Search/OnlineThumbnailLookup.cs')
          t=p.read_text(encoding='utf-8')
          dec=lambda s: base64.b64decode(s).decode('utf-8')
          old=dec('')
          new=dec('')
          if old not in t: raise SystemExit('query block not found')
          t=t.replace(old,new)
          oldkey='string key="v2|"+Identify(title).CacheIdentity;'
          if oldkey not in t: raise SystemExit('v2 cache key not found')
          t=t.replace(oldkey,'string key="v3|"+Identify(title).CacheIdentity;')
          s=t.index(' static bool ContainsEpisodeReference(')
          e=t.index('\n static async Task<List<Dictionary<string,object>>> SearchRows',s)
          rel=dec('')
          t=t[:s]+rel+t[e:]
          marker='  if(tv.IndexOf("season 2 episode 7",StringComparison.OrdinalIgnoreCase)<0)throw new InvalidOperationException("TV episode thumbnail query lost its season/episode identity.");'
          add=dec('')
          if marker not in t: raise SystemExit('self-test marker not found')
          t=t.replace(marker,marker+'\n'+add)
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VideoShelf/Search/OnlineThumbnailLookup.cs
          git diff --cached --exit-code && { echo 'No source changes produced'; exit 1; }
          git commit -m 'Reject weak and unrelated episode thumbnails'
          git push
