name: Publish approved v1.7.8

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.7.8.yml'

permissions:
  contents: write

jobs:
  publish-v1-7-8:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: 1.7.8
      RELEASE_TAG: v1.7.8
      RELEASE_SOURCE: 0b621927be40ec1b0058248e3a9dc898e7ef820e
      PREVIOUS_VERSION: 1.7.7
      PREVIOUS_SHA256: 6a96f8013aa4bcd00c82d937e8b8660e48cadb32a796a5f88481d51296ef9608
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SOURCE }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify approved source
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SOURCE) { throw "Expected source $env:RELEASE_SOURCE but checked out $head." }
          $source = Get-Content '.\src\VideoShelf\Application\AppVersion.cs' -Raw
          $match = [regex]::Match($source, 'Current\s*=\s*"([0-9]+(?:\.[0-9]+){1,3})"')
          if (-not $match.Success -or $match.Groups[1].Value -ne $env:RELEASE_VERSION) { throw 'Approved source does not contain the expected application version.' }
          $project = Get-Content '.\src\VideoShelf.TransferHost\VideoShelf.TransferHost.csproj' -Raw
          if ($project -notmatch 'MonoTorrent" Version="3\.0\.2"') { throw 'v1.7.8 must ship the stable MonoTorrent 3.0.2 runtime.' }
          $portraits = Get-Content '.\src\VideoShelf\Search\PortraitLookup.cs' -Raw
          $thumbnails = Get-Content '.\src\VideoShelf\Search\OnlineThumbnailLookup.cs' -Raw
          if ($portraits -notmatch 'kp=-2' -or $portraits -match 'kp=1(?:[^0-9-]|$)') { throw 'Collection artwork must force DuckDuckGo Safe Search off.' }
          if ($thumbnails -notmatch 'kp=-2' -or $thumbnails -match 'kp=1(?:[^0-9-]|$)') { throw 'Online thumbnails must force DuckDuckGo Safe Search off.' }
          if ($thumbnails -notmatch 'EpisodeLabel' -or $thumbnails -notmatch 'screenshot' -or $thumbnails -notmatch 'CacheIdentity') { throw 'Episode-specific thumbnail lookup is missing.' }

      - name: Build and self-test VideoShelf
        shell: cmd
        run: |
          Start.cmd --build-only
          VideoShelf.exe --self-test

      - name: Publish and self-test transfer runtime
        shell: powershell
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-release-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\src\VideoShelf.TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          Copy-Item '.\VideoShelf.ico' (Join-Path $package 'VideoShelf.ico')
          Copy-Item '.\VideoShelf.png' (Join-Path $package 'VideoShelf.png')
          $test = Start-Process -FilePath (Join-Path $transferDir 'VideoShelf.TransferHost.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'TransferHost self-test failed.' }
          "VIDEOSHELF_RELEASE_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exact v1.7.8 installer
        shell: powershell
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found.' }

          $issPath = '.\installer\VideoShelf.release.iss'
          $iss = Get-Content '.\installer\VideoShelf.iss' -Raw
          $iss = [regex]::Replace($iss, '(?m)^OutputBaseFilename=.*$', "OutputBaseFilename=VideoShelf-Setup-v$env:RELEASE_VERSION")
          $iss = [regex]::Replace($iss, '(?m)^VersionInfoVersion=.*$', "VersionInfoVersion=$env:RELEASE_VERSION.0")
          Set-Content -Path $issPath -Value $iss -Encoding UTF8

          $out = Join-Path $env:RUNNER_TEMP 'VideoShelf-release-v1.7.8'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $iscc "/DSourceDir=$env:VIDEOSHELF_RELEASE_PACKAGE" "/DOutputDir=$out" "/DAppVersion=$env:RELEASE_VERSION" $issPath
          if ($LASTEXITCODE -ne 0) { throw 'Release installer compilation failed.' }
          $installer = Join-Path $out ("VideoShelf-Setup-v{0}.exe" -f $env:RELEASE_VERSION)
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) { throw 'Release installer was not created correctly.' }
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer SHA256: $hash"
          "VIDEOSHELF_RELEASE_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VIDEOSHELF_RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test clean install
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-v1.7.8-clean-install'
          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferExe = Join-Path $installDir 'TransferHost\VideoShelf.TransferHost.exe'
          $install = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }
          if (!(Test-Path $mainExe) -or !(Test-Path $transferExe)) { throw 'Installed release is incomplete.' }
          $mainTest = Start-Process -FilePath $mainExe -ArgumentList '--self-test' -WorkingDirectory $installDir -Wait -PassThru
          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $transferExe) -Wait -PassThru
          if ($mainTest.ExitCode -ne 0 -or $transferTest.ExitCode -ne 0) { throw 'Installed release self-test failed.' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Clean-install uninstaller was not created.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Clean-install uninstall failed.' }

      - name: Test v1.7.7 upgrade and runtime replacement
        shell: powershell
        run: |
          $previousInstaller = Join-Path $env:RUNNER_TEMP 'VideoShelf-Setup-v1.7.7.exe'
          $previousUrl = 'https://github.com/x0XP/VideoShelf/releases/download/v1.7.7/VideoShelf-Setup-v1.7.7.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $previousUrl -OutFile $previousInstaller
          $previousHash = (Get-FileHash -Path $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($previousHash -ne $env:PREVIOUS_SHA256) { throw "Unexpected v1.7.7 installer hash: $previousHash" }

          $installDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-v177-to-v178-upgrade-test'
          $oldInstall = Start-Process -FilePath $previousInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'v1.7.7 install failed.' }

          $mainExe = Join-Path $installDir 'VideoShelf.exe'
          $transferDir = Join-Path $installDir 'TransferHost'
          $transferExe = Join-Path $transferDir 'VideoShelf.TransferHost.exe'
          $transferDll = Join-Path $transferDir 'VideoShelf.TransferHost.dll'
          if (!(Test-Path $mainExe) -or !(Test-Path $transferExe) -or !(Test-Path $transferDll)) { throw 'v1.7.7 installation was incomplete.' }
          'must disappear during v1.7.8 replacement' | Set-Content -Path (Join-Path $transferDir 'v177-runtime-sentinel.txt') -Encoding ASCII

          $oldMain = Start-Process -FilePath $mainExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 2
          if ($oldMain.HasExited) { throw 'v1.7.7 VideoShelf did not remain running.' }

          $oldHost = Start-Process -FilePath $transferExe -ArgumentList @('stream','--source','magnet:?xt=urn:btih:0123456789012345678901234567890123456789','--title','v177-runtime-lock') -WorkingDirectory $transferDir -PassThru
          Start-Sleep -Seconds 2
          if ($oldHost.HasExited) { throw 'v1.7.7 TransferHost did not remain running long enough to test replacement.' }

          $upgrade = Start-Process -FilePath $env:VIDEOSHELF_RELEASE_INSTALLER -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/VIDEOSHELFUPDATE=1',('/DIR="' + $installDir + '"')) -PassThru
          $upgrade.WaitForExit()
          if ($upgrade.ExitCode -ne 0) { throw "v1.7.7 -> v1.7.8 upgrade failed with exit code $($upgrade.ExitCode)." }

          try { $oldMain.Refresh() } catch { }
          if (-not $oldMain.HasExited) { Stop-Process -Id $oldMain.Id -Force -ErrorAction SilentlyContinue; throw 'Installer did not terminate the old VideoShelf process.' }
          try { $oldHost.Refresh() } catch { }
          if (-not $oldHost.HasExited) { Stop-Process -Id $oldHost.Id -Force -ErrorAction SilentlyContinue; throw 'Installer did not terminate the old TransferHost process.' }
          if (Test-Path (Join-Path $transferDir 'v177-runtime-sentinel.txt')) { throw 'v1.7.7 TransferHost contents survived the upgrade.' }

          $expectedDll = Join-Path $env:VIDEOSHELF_RELEASE_PACKAGE 'TransferHost\VideoShelf.TransferHost.dll'
          if ((Get-FileHash $transferDll -Algorithm SHA256).Hash -ne (Get-FileHash $expectedDll -Algorithm SHA256).Hash) { throw 'Installed TransferHost does not match the v1.7.8 package.' }
          $transferTest = Start-Process -FilePath $transferExe -ArgumentList '--self-test' -WorkingDirectory $transferDir -Wait -PassThru
          if ($transferTest.ExitCode -ne 0) { throw 'TransferHost self-test failed after v1.7.7 -> v1.7.8 upgrade.' }

          $restarted = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ([DateTime]::UtcNow -lt $deadline -and $null -eq $restarted) {
            $restarted = Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $mainExe -and $_.Id -ne $oldMain.Id } catch { $false } } | Select-Object -First 1
            if ($null -eq $restarted) { Start-Sleep -Milliseconds 500 }
          }
          if ($null -eq $restarted) { throw 'v1.7.8 installed but VideoShelf did not reopen.' }
          Get-Process -Name 'VideoShelf' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $mainExe } catch { $false } } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'VideoShelf.TransferHost' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Upgrade regression uninstall failed.' }

      - name: Publish stable GitHub Release
        shell: powershell
        run: |
          $notes = @'
          ## VideoShelf v1.7.8

          - Makes online video thumbnails episode-specific instead of reusing generic series artwork.
          - Preserves anime-style episode numbers and conventional `SxxExx` / `x` episode notation when building DuckDuckGo image queries.
          - Gives each episode its own thumbnail cache identity while allowing different encodes of the same episode to reuse the same image.
          - Ranks episode screenshots, screencaps and stills above posters, wallpapers and promotional artwork, and avoids generic artwork when an episode-specific match cannot be found.
          - Forces DuckDuckGo Safe Search off for both collection/person artwork and online-result thumbnail searches, including the underlying image-results request.
          - Retains the stable streaming/runtime fixes from v1.7.7.
          - Includes a direct v1.7.7 -> v1.7.8 upgrade regression test with VideoShelf and TransferHost running.

          This release passed the VideoShelf self-test, episode-thumbnail query regression checks, DuckDuckGo Safe Search configuration gate, TransferHost/LibVLC runtime self-test, clean-install test, v1.7.7 in-place upgrade test, runtime-replacement verification and uninstall test before publication.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes-v1.7.8.md'
          Set-Content -Path $notesPath -Value $notes -Encoding UTF8
          gh release create $env:RELEASE_TAG $env:VIDEOSHELF_RELEASE_INSTALLER --repo $env:GITHUB_REPOSITORY --title 'VideoShelf v1.7.8' --target $env:RELEASE_SOURCE --notes-file $notesPath --latest
