name: Cleanup v1.7.11 releases

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-v1.7.11-releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep only v1.7.11 public release
        shell: bash
        run: |
          gh api repos/x0XP/VideoShelf/releases --paginate --jq '.[].tag_name' | while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "v1.7.11" ]; then
              gh release delete "$tag" --repo x0XP/VideoShelf --yes
            fi
          done
