name: Installer visual regression

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/**'
      - '.github/workflows/installer-visual.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'installer/**'
      - '.github/workflows/installer-visual.yml'
      - '.github/workflows/build.yml'

jobs:
  capture-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build VideoShelf
        shell: cmd
        run: Start.cmd --build-only

      - name: Publish installer package
        shell: powershell
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'VideoShelf-package'
          $transferDir = Join-Path $package 'TransferHost'
          New-Item -ItemType Directory -Force -Path $transferDir | Out-Null
          dotnet publish '.\TransferHost\VideoShelf.TransferHost.csproj' -c Release -r win-x64 --self-contained true -o $transferDir
          if ($LASTEXITCODE -ne 0) { throw 'TransferHost publish failed.' }
          Copy-Item '.\VideoShelf.exe' (Join-Path $package 'VideoShelf.exe')
          Copy-Item '.\VideoShelf.ico' (Join-Path $package 'VideoShelf.ico')
          "VIDEOSHELF_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $installerDir = Join-Path $env:RUNNER_TEMP 'VideoShelf-installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          & $iscc "/DSourceDir=$env:VIDEOSHELF_PACKAGE" "/DOutputDir=$installerDir" "/DAppVersion=1.7.0" '.\installer\VideoShelf.iss'
          if ($LASTEXITCODE -ne 0) { throw 'VideoShelf installer compilation failed.' }
          $installer = Join-Path $installerDir 'VideoShelf-Setup-v1.7.exe'
          if (!(Test-Path $installer)) { throw 'VideoShelf installer was not created.' }
          "VIDEOSHELF_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Capture installer pages
        shell: powershell
        run: |
          .\installer\CaptureInstallerScreens.ps1 -Installer $env:VIDEOSHELF_INSTALLER -OutputDir $env:RUNNER_TEMP

      - name: Verify installer screenshots
        shell: powershell
        run: |
          foreach ($name in @('tasks','ready','installing','finish')) {
            $shot = Join-Path $env:RUNNER_TEMP ("VideoShelf-installer-$name.png")
            if (!(Test-Path $shot) -or (Get-Item $shot).Length -lt 10000) {
              throw "Required installer screenshot is missing or too small: $shot"
            }
            Copy-Item $shot ".\VideoShelf-installer-$name.png"
          }

      - name: Upload installer screenshots
        uses: actions/upload-artifact@v4
        with:
          name: VideoShelf-installer-screenshots
          path: VideoShelf-installer-*.png
          if-no-files-found: error
