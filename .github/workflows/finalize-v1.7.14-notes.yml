name: Finalize v1.7.14 changelog

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/finalize-v1.7.14-notes.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Move relaunch hardening into v1.7.14 notes
        shell: pwsh
        run: |
          $path = 'CHANGELOG.md'
          $text = Get-Content $path -Raw
          $race = '- Hardened update relaunch so the newly installed VideoShelf waits briefly for the previous instance mutex to clear instead of exiting immediately during a tight upgrade handoff.'
          if (-not $text.Contains($race)) { throw 'Updater relaunch changelog entry was not found.' }
          $text = $text.Replace($race + "`n", '')
          $header = @'
          VideoShelf 1.7.14 — 14 September 2026
          --------------------------------------
          - Hardened update relaunch so the newly installed VideoShelf waits briefly for the previous instance mutex to clear instead of exiting immediately during a tight upgrade handoff.
          - Preserved the compact subtitle/volume player controls and corrected transport layout introduced in v1.7.13.

          '@
          $text = $header + $text
          Set-Content -Path $path -Value $text -NoNewline -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/finalize-v1.7.14-notes.yml'
          git add CHANGELOG.md
          git commit -m 'Document VideoShelf v1.7.14'
          git push origin HEAD:main
