name: Fix library intelligence build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-library-intelligence-build.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Repair tooltip escape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/VideoShelf/UI/Shelf/Shelf.Library.cs')
          s=p.read_text(encoding='utf-8')
          bad=')+"\n"+v.Name'
          good=')+"\\n"+v.Name'
          if bad not in s:
              raise SystemExit('Expected tooltip newline was not found')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/VideoShelf/UI/Shelf/Shelf.Library.cs
          git commit -m 'Fix library tooltip escaping'
          git push origin HEAD:main
