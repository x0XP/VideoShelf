name: Apply subtitle selector

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-subtitle-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/patch_subtitles.py
      - name: Commit subtitle support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/VideoShelf.TransferHost/Player/OptimizedStreamForm.cs
          git commit -m "Add selectable subtitle tracks"
          git push origin main
