name: Finalize update relaunch fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-update-relaunch-race.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Document fix and remove one-shot workflow
        shell: pwsh
        run: |
          $path = 'CHANGELOG.md'
          $text = Get-Content $path -Raw
          $needle = '- Added custom-drawn subtitle, volume and muted-volume icons matching the existing VideoShelf player controls.'
          $replacement = $needle + "`n- Hardened update relaunch so the newly installed VideoShelf waits briefly for the previous instance mutex to clear instead of exiting immediately during a tight upgrade handoff."
          if (-not $text.Contains($needle)) { throw 'v1.7.13 changelog insertion point was not found.' }
          $text = $text.Replace($needle, $replacement)
          Set-Content -Path $path -Value $text -NoNewline -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/fix-update-relaunch-race.yml'
          git add CHANGELOG.md
          git commit -m 'Document updater relaunch hardening'
          git push origin HEAD:main
