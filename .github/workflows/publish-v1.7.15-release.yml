name: Publish VideoShelf v1.7.15 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.7.15-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: 1.7.15
      RELEASE_TAG: v1.7.15
      RELEASE_SOURCE: a6f9da08959d3c19f884cc32a92d065c03ab58b4
      VALIDATED_SOURCE: 01e8c8fab2a4e9120c63e89afec0f4133841bc47
      VALIDATED_RUN: 34875772814
      VALIDATED_HASH: ca52a055c75cbf02da8c984d37a03801d1f206ada724fb8efedd0577265a7b54
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out clean release source
        uses: actions/checkout@v7
        with:
          ref: a6f9da08959d3c19f884cc32a92d065c03ab58b4
          fetch-depth: 0

      - name: Verify clean release source
        shell: powershell
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SOURCE) { throw "Expected $env:RELEASE_SOURCE but checked out $head." }
          $source = Get-Content '.\src\VideoShelf\Application\AppVersion.cs' -Raw
          if ($source -notmatch 'Current\s*=\s*"1\.7\.15"') { throw 'AppVersion.Current is not 1.7.15.' }
          $changelog = Get-Content '.\CHANGELOG.md' -Raw
          if (-not $changelog.StartsWith('VideoShelf 1.7.15')) { throw 'v1.7.15 changelog is missing.' }
          $changed = @(git diff --name-only $env:VALIDATED_SOURCE $env:RELEASE_SOURCE)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/publish-v1.7.15.yml') {
            throw "Clean release source differs from the validated source in unexpected files: $($changed -join ', ')"
          }
          Write-Host 'Clean release source differs from the validated application source only by removal of the temporary publisher workflow.'

      - name: Download validated installer
        uses: actions/download-artifact@v4
        with:
          name: VideoShelf-Setup-v1.7.15-validated
          path: .
          github-token: ${{ github.token }}
          run-id: 34875772814

      - name: Verify validated installer
        shell: powershell
        run: |
          $installer = '.\VideoShelf-Setup-v1.7.15.exe'
          if (!(Test-Path $installer)) { throw 'Validated installer artifact is missing.' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:VALIDATED_HASH) { throw "Installer hash mismatch: $hash" }
          if ((Get-Item $installer).Length -lt 1000000) { throw 'Validated installer is unexpectedly small.' }
          Write-Host "Validated installer SHA-256: $hash"

      - name: Create and verify release tag via GitHub API
        shell: powershell
        run: |
          $refEndpoint = "repos/x0XP/VideoShelf/git/ref/tags/$($env:RELEASE_TAG)"
          gh api $refEndpoint *> $env:RUNNER_TEMP\existing-tag.json
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST repos/x0XP/VideoShelf/git/refs -f "ref=refs/tags/$($env:RELEASE_TAG)" -f "sha=$($env:RELEASE_SOURCE)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'GitHub API could not create the v1.7.15 tag.' }
          }
          $tag = gh api $refEndpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read back the v1.7.15 tag.' }
          if ($tag.object.type -ne 'commit' -or $tag.object.sha -ne $env:RELEASE_SOURCE) {
            throw "v1.7.15 tag does not point directly to $env:RELEASE_SOURCE."
          }
          Write-Host "Verified $env:RELEASE_TAG -> $($tag.object.sha)"

      - name: Publish v1.7.15
        shell: powershell
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'v1.7.15-notes.md'
          @'
          ## VideoShelf v1.7.15

          - Restores online-result screenshots/thumbnails and collection artwork.
          - Uses browser-compatible image requests with Bing fallback when DuckDuckGo is blocked or unavailable.
          - Retries original/provider thumbnail URLs instead of leaving cards blank after a single blocked image.
          - Adds search-context artwork fallback for overly specific torrent titles.
          - Adds live artwork regression coverage for real online results and collection rendering.
          '@ | Set-Content -Path $notes -Encoding UTF8
          gh release create $env:RELEASE_TAG '.\VideoShelf-Setup-v1.7.15.exe' --repo x0XP/VideoShelf --verify-tag --title 'VideoShelf v1.7.15' --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub rejected v1.7.15 release creation.' }
